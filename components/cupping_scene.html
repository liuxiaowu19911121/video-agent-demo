<div class="scene" id="scene-{{ index }}">
  <div style="position: absolute; top: 200px; width: 500px; height: 400px; border: 10px solid rgba(255,255,255,0.4); border-radius: 250px 250px 20px 20px; border-bottom: none; z-index: 10;"></div>
  
  <div class="flame" style="position: absolute; top: 350px; width: 80px; height: 120px; background: orange; border-radius: 50%; z-index: 5;"></div>
  
  <div id="skin-{{ index }}" style="position: absolute; bottom: 0; width: 100%; height: 200px; background: #e8b4a2; transform-origin: bottom center;"></div>
  
  <div style="position: absolute; top: 250px; right: 300px; color: white; font-size: 100px; font-weight: bold;">
    <!-- 💡 这里直接写死最终的数字，放弃过程滚动 -->
    <span id="pressure-{{ index }}">{{ params.pressure }}</span> 千帕
  </div>
  <div style="position: absolute; bottom: 80px; color: white; font-size: 60px;">{{ params.text }}</div>
</div>
<script>
  window.sceneAnims.push((tl, offset) => {
    tl.set('#scene-{{ index }}', { opacity: 1 }, offset);
    
    // 皮肤形变
    tl.to('#skin-{{ index }}', { scaleY: 1.5, duration: 2, ease: "power2.out" }, offset + 1);
    
    // 火焰缩放
    tl.to('#scene-{{ index }} .flame', { scaleY: 1.2, duration: 0.2, repeat: 3, yoyo: true }, offset);
    
    // 场景淡出
    tl.to('#scene-{{ index }}', { opacity: 0, duration: 0.5 }, offset + {{ duration }} - 0.5);
  });
</script>
